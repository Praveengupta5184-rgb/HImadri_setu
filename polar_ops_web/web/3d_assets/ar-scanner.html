<!DOCTYPE html>
<html>
<head>
    <title>POLAR-OPS - AR Cargo Scanner</title>
    <!-- A-Frame and AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <!-- When the Hiro marker is detected -->
        <a-marker preset="hiro">
            <!-- Holographic highlight box -->
            <a-box position="0 0.5 0" material="color: cyan; opacity: 0.5; wireframe: true" scale="1.2 1.2 1.2"></a-box>
            
            <!-- Metadata overlays -->
            <a-text value="CARGO-1042" position="0 1.5 0" align="center" color="white" width="6"></a-text>
            <a-text value="Destination: Maitri" position="0 1.2 0" align="center" color="white" scale="0.6 0.6 0.6"></a-text>
            <a-text value="Status: IN-TRANSIT" position="0 1.0 0" align="center" color="#4fc3f7" scale="0.5 0.5 0.5"></a-text>
            <a-text value="Weight: 25.5 kg" position="0 0.8 0" align="center" color="yellow" scale="0.5 0.5 0.5"></a-text>
            
            <!-- Alert indicator (e.g., Hazardous or Fragile) -->
            <a-entity position="0 2 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
                <a-cylinder position="0 0.25 0" radius="0.1" height="0.5" color="red"></a-cylinder>
                <a-cone position="0 0.6 0" radius-top="0" radius-bottom="0.2" height="0.4" color="red"></a-cone>
            </a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
